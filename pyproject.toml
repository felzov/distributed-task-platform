[project]
name = "distributed-task-platform"
version = "0.1.0"
description = "Background-job system with explicit failure behaviour: FastAPI, PostgreSQL, RabbitMQ and async workers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_platform"]

# Allowlist: hatchling ignores .git/info/exclude, so anything not listed here stays out of the sdist.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs real PostgreSQL/RabbitMQ; run with `make test-integration` (from phase 2)",
]
# A deprecation fails the run instead of scrolling past; the lock pins versions, so this only
# trips on a deliberate upgrade.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]

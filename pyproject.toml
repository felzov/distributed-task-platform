[project]
name = "distributed-task-platform"
version = "0.1.0"
description = "Background-job system with explicit failure behaviour: FastAPI, PostgreSQL, RabbitMQ and async workers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.2.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_platform"]

# Allowlist: hatchling ignores .git/info/exclude, so anything not listed here stays out of the sdist.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs real PostgreSQL/RabbitMQ; run with `make test-integration`",
]
# Async tests and fixtures get a fresh event loop per test (ADR 0003). An asyncpg connection is
# bound to the loop that opened it, so engines are created per test, never per session.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
# A deprecation fails the run instead of scrolling past; the lock pins versions, so this only
# trips on a deliberate upgrade.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    # SQLAlchemy reports mapping mistakes (e.g. a primary key nothing fills in) only as warnings.
    "error::sqlalchemy.exc.SAWarning",
]

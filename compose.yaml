# Local services for development and integration tests. Values come from .env (see .env.example).
services:
  postgres:
    # Same image and digest as the CI service container.
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_USER: task_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: task_platform
    ports:
      # Reachable only from this machine.
      - "127.0.0.1:5432:5432"
    volumes:
      # Since PostgreSQL 18 the image keeps its data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      # Runs only when the volume is empty: creates the task_platform_test database.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP on purpose: during first-time init the image runs a temporary server that listens
      # only on the Unix socket, so a socket check would report healthy before init has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U task_platform -d task_platform"]
      interval: 2s
      timeout: 3s
      retries: 15
      # Failed checks during first-time init do not count towards `retries`.
      start_period: 30s

  rabbitmq:
    # RabbitMQ 4.3 or later is required (ADR 0004). Same image and digest as CI's service container.
    image: rabbitmq:4.3.7-alpine@sha256:b1f997f74103d08fc1f20a13890dc44fe6cfa51d528cf521b480ada988d3ffa5
    # RabbitMQ keeps its data under the node name rabbit@<hostname>; a fixed hostname keeps the
    # same data (users, queues, messages) when the container is recreated.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: task_platform
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env (see .env.example)}
    ports:
      # AMQP only, reachable only from this machine. No management UI.
      - "127.0.0.1:5672:5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # Passes once the AMQP listener accepts connections, not just when the node is up.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
  rabbitmq-data:
